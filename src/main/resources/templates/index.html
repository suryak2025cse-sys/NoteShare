<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteShare - Student Notes Sharing Repository</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a th:href="@{/}" class="logo">NoteShare</a>
        <ul class="nav-links">
            <li><a th:href="@{/}" class="active">Home</a></li>
            <li><a th:href="@{/students}">Students</a></li>
            <li><a th:href="@{/subjects}">Subjects</a></li>
            <li><a th:href="@{/notes}">Notes</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card hero">
            <h1>NoteShare</h1>
            <p>Student Notes Sharing Repository</p>
            <div class="hero-buttons">
                <a th:href="@{/students}" class="btn btn-primary">Students</a>
                <a th:href="@{/subjects}" class="btn btn-success">Subjects</a>
                <a th:href="@{/notes}" class="btn btn-warning">Notes</a>
            </div>
        </div>
    </div>
</body>
</html>
